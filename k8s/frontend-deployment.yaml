apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-metrics-frontend
  namespace: pod-metrics-dashboard
  labels:
    app: pod-metrics-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-metrics-frontend
  template:
    metadata:
      labels:
        app: pod-metrics-frontend
    spec:
      containers:
      - name: frontend
        image: pod-metrics-frontend:latest
        imagePullPolicy: Never  # For Kind local development
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pod-metrics-frontend-service
  namespace: pod-metrics-dashboard
  labels:
    app: pod-metrics-frontend
spec:
  selector:
    app: pod-metrics-frontend
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP  # For internal cluster communication
