# Pre-commit hooks for bean-stalk-k8s
# Install with: pip install pre-commit
# Setup with: pre-commit install

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Remove trailing whitespace
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

      # Ensure files end with a newline
      - id: end-of-file-fixer

      # Validate YAML syntax
      - id: check-yaml
        args: [--unsafe]  # Allows custom YAML tags (needed for k8s configs)

      # Prevent large files from being committed (>500KB)
      - id: check-added-large-files
        args: [--maxkb=500]

      # Check for merge conflict markers
      - id: check-merge-conflict

      # Check for files with names that would conflict on case-insensitive filesystems
      - id: check-case-conflict

      # Ensure consistent line endings (converts to LF)
      - id: mixed-line-ending
        args: [--fix=lf]

      # Check for files that parse as valid JSON
      - id: check-json

      # Check for debugger imports and breakpoint() calls in Python
      - id: debug-statements

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
        args: ['--config=.gitleaks.toml']

  # Python code formatting and linting
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=100]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: [--max-line-length=100, --extend-ignore=E203]

  # Go formatting and linting
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      # Format Go code
      - id: go-fmt
        args: [-w]
        files: ^backend/.*\.go$

      # Run go mod tidy
      - id: go-mod-tidy
        files: ^backend/go\.(mod|sum)$
        pass_filenames: false
        args: [-C, backend]

  # Local Go hooks (using system Go tools)
  - repo: local
    hooks:
      # Go imports (requires goimports in PATH: go install golang.org/x/tools/cmd/goimports@latest)
      - id: go-imports
        name: go-imports
        entry: bash -c '~/go/bin/goimports -w "$@"' --
        language: system
        files: ^backend/.*\.go$
        pass_filenames: true

      # Go vet (static analysis)
      - id: go-vet
        name: go-vet
        entry: bash -c 'cd backend && go vet ./...'
        language: system
        files: ^backend/.*\.go$
        pass_filenames: false
