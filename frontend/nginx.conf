server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    # Kubernetes DNS resolver - defers DNS resolution until request time
    resolver kube-dns.kube-system.svc.cluster.local valid=10s;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend service (for Kubernetes deployment)
    location /api {
        # Use variable to defer DNS resolution until request time
        set $backend "pod-metrics-backend-service.pod-metrics-dashboard.svc.cluster.local:8080";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
